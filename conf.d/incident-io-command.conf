/*
 * incident.io integration for Icinga 2 - command, contact and metadata builder.
 *
 * Install to /etc/icinga2/zones.d/master/ so Icinga's config sync distributes
 * it to every master in the master zone. Notifications only ever fire from the
 * master zone, so satellites and agents need nothing.
 *
 * The handler binary is NOT distributed by zone sync - Icinga syncs .conf files
 * only. Install the package on every master.
 */

/* ---------------------------------------------------------------------------
 * Build the metadata blob.
 *
 * Returns a JSON object as a string, assembled from four layers - each one
 * overriding the last:
 *
 *   1. globals.IncidentIoDefaultMetadata   estate-wide constants
 *   2. host  vars named in vars.incident_io_metadata_vars   (allowlist)
 *   3. host  vars.incident_io_metadata                      (explicit dict)
 *   4. same two, at service level
 *
 * Values may be strings, numbers, booleans, arrays or nested dictionaries -
 * Json.encode handles all of them, so metadata is as deep as you like.
 *
 * This is evaluated at notification time, so the globals lookup below works
 * regardless of the order your config files load in.
 * ------------------------------------------------------------------------ */
globals.incident_io_metadata = function(h, s) {
  var meta = {}

  if (globals.contains("IncidentIoDefaultMetadata")) {
    for (k => v in globals.IncidentIoDefaultMetadata) {
      meta[k] = v
    }
  }

  if (h != null) {
    meta["hostgroups"] = h.groups

    if (h.vars.incident_io_metadata_vars != null) {
      for (n in h.vars.incident_io_metadata_vars) {
        if (h.vars[n] != null) {
          meta[n] = h.vars[n]
        }
      }
    }

    if (h.vars.incident_io_metadata != null) {
      for (k => v in h.vars.incident_io_metadata) {
        meta[k] = v
      }
    }
  }

  if (s != null) {
    meta["servicegroups"] = s.groups

    if (s.vars.incident_io_metadata_vars != null) {
      for (n in s.vars.incident_io_metadata_vars) {
        if (s.vars[n] != null) {
          meta[n] = s.vars[n]
        }
      }
    }

    if (s.vars.incident_io_metadata != null) {
      for (k => v in s.vars.incident_io_metadata) {
        meta[k] = v
      }
    }
  }

  return Json.encode(meta)
}

/* ---------------------------------------------------------------------------
 * The notification command.
 * ------------------------------------------------------------------------ */
object NotificationCommand "incident-io" {
  command = [ "/usr/bin/incident-io-icinga" ]

  env = {
    INCIDENT_IO_URL           = IncidentIoUrl
    INCIDENT_IO_TOKEN         = IncidentIoToken
    ICINGAWEB_URL             = IncidentIoIcingaWebUrl

    NOTIFICATION_TYPE         = "$notification.type$"
    NOTIFICATION_AUTHOR       = "$notification.author$"
    NOTIFICATION_COMMENT      = "$notification.comment$"

    HOST_NAME                 = "$host.name$"

    /* Host and service notifications need different macros, so the apply rules
     * below map them onto these neutral names. */
    SERVICE_NAME              = "$incident_io_service$"
    STATE                     = "$incident_io_state$"
    OUTPUT                    = "$incident_io_output$"
    CHECK_SOURCE              = "$incident_io_check_source$"
    INCIDENT_IO_METADATA_JSON = "$incident_io_metadata_json$"
  }
}

/* ---------------------------------------------------------------------------
 * A contact for the integration.
 *
 * incident.io owns routing, escalation and on-call, so this user exists purely
 * to satisfy Icinga's notification model. It is always on duty and filters
 * nothing - do the filtering in your apply rules or in incident.io.
 * ------------------------------------------------------------------------ */
object User "incident-io" {
  display_name = "incident.io"
  enable_notifications = true
  period = "24x7"
}

template Notification "incident-io-notification" {
  command = "incident-io"
  users = [ "incident-io" ]
  period = "24x7"

  /* Re-notify hourly while a problem is open. incident.io dedupes on
   * deduplication_key, so these update the existing alert rather than creating
   * new ones - a cheap heartbeat that heals a dropped POST. */
  interval = 1h

  types = [ Problem, Recovery, Acknowledgement, Custom,
            FlappingStart, FlappingEnd,
            DowntimeStart, DowntimeEnd, DowntimeRemoved ]
}
