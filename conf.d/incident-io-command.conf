/*
 * incident.io integration for Icinga 2 - command, contact and metadata builder.
 *
 * Installs to /etc/icinga2/conf.d/ on each master, NOT zones.d.
 *
 * Constants defined in conf.d are not visible to configuration synced from
 * zones.d, so a command in zones.d referencing IncidentIoUrl fails validation.
 * Since the handler binary has to be installed on every master anyway - zone
 * sync distributes .conf files only - installing the config per-master too
 * removes the problem without costing anything.
 *
 * Notifications only ever fire from the master zone, so satellites and agents
 * need nothing.
 */

/* ---------------------------------------------------------------------------
 * Build the metadata blob.
 *
 * Returns a JSON object as a string, assembled from four layers - each one
 * overriding the last:
 *
 *   1. globals.IncidentIoDefaultMetadata   estate-wide constants
 *   2. host  vars named in vars.incident_io_metadata_vars   (allowlist)
 *   3. host  vars.incident_io_metadata                      (explicit dict)
 *   4. same two, at service level
 *
 * Values may be strings, numbers, booleans, arrays or nested dictionaries -
 * Json.encode handles all of them, so metadata is as deep as you like.
 *
 * This is evaluated at notification time, so the globals lookup below works
 * regardless of the order your config files load in.
 * ------------------------------------------------------------------------ */
globals.incident_io_metadata = function(h, s) {
  var meta = {}

  if (globals.contains("IncidentIoDefaultMetadata")) {
    for (k => v in globals.IncidentIoDefaultMetadata) {
      meta[k] = v
    }
  }

  if (h != null) {
    meta["hostgroups"] = h.groups

    if (h.vars.incident_io_metadata_vars != null) {
      for (n in h.vars.incident_io_metadata_vars) {
        if (h.vars[n] != null) {
          meta[n] = h.vars[n]
        }
      }
    }

    if (h.vars.incident_io_metadata != null) {
      for (k => v in h.vars.incident_io_metadata) {
        meta[k] = v
      }
    }
  }

  if (s != null) {
    meta["servicegroups"] = s.groups

    if (s.vars.incident_io_metadata_vars != null) {
      for (n in s.vars.incident_io_metadata_vars) {
        if (s.vars[n] != null) {
          meta[n] = s.vars[n]
        }
      }
    }

    if (s.vars.incident_io_metadata != null) {
      for (k => v in s.vars.incident_io_metadata) {
        meta[k] = v
      }
    }
  }

  /* Escape every $ as $$ before handing the string back.
   *
   * The return value is substituted into the command's env block via
   * $incident_io_metadata_json$, and Icinga runs macro resolution over the
   * substituted value as well - so a metadata value that merely looks like a
   * macro is otherwise expanded behind your back. Without this, a host var of
   * "$host.name$" arrives at the handler as the host's name, and a literal
   * "$$" collapses to "$".
   *
   * The macro processor turns each $$ back into a single $, so the handler
   * receives exactly what Json.encode produced. Note this means the raw return
   * value has doubled dollars in it: that is correct for the env block, but
   * expect it if you call this function by hand in `icinga2 console`.
   */
  return Json.encode(meta).replace("$", "$$")
}

/* ---------------------------------------------------------------------------
 * Which Icinga Web 2 front end to build source_url against.
 *
 * Read through globals rather than referenced as a bare constant on purpose.
 * The setting is optional, and a bare reference to a name nobody defined is a
 * hard config error - so an operator upgrading from a release that predates
 * this setting would find their whole Icinga config failing to load. This
 * returns the default instead.
 *
 * Evaluated when the command object is activated, which is after every
 * configuration file has been read, so it does not matter that
 * incident-io-secrets.conf loads after this one.
 * ------------------------------------------------------------------------ */
globals.incident_io_icingaweb_style = function() {
  if (globals.contains("IncidentIoIcingaWebStyle")) {
    return globals.IncidentIoIcingaWebStyle
  }

  return "icingadb"
}

/* ---------------------------------------------------------------------------
 * The notification command.
 * ------------------------------------------------------------------------ */
object NotificationCommand "incident-io" {
  command = [ "/usr/bin/incident-io-icinga" ]

  env = {
    INCIDENT_IO_URL           = IncidentIoUrl
    INCIDENT_IO_TOKEN         = IncidentIoToken
    ICINGAWEB_URL             = IncidentIoIcingaWebUrl
    ICINGAWEB_STYLE           = incident_io_icingaweb_style()

    NOTIFICATION_TYPE         = "$notification.type$"
    NOTIFICATION_AUTHOR       = "$notification.author$"
    NOTIFICATION_COMMENT      = "$notification.comment$"

    HOST_NAME                 = "$host.name$"

    /* Host and service notifications need different macros, so the apply rules
     * below map them onto these neutral names. */
    SERVICE_NAME              = "$incident_io_service$"
    STATE                     = "$incident_io_state$"
    OUTPUT                    = "$incident_io_output$"
    CHECK_SOURCE              = "$incident_io_check_source$"
    INCIDENT_IO_METADATA_JSON = "$incident_io_metadata_json$"
  }
}

/* ---------------------------------------------------------------------------
 * A contact for the integration.
 *
 * incident.io owns routing, escalation and on-call, so this user exists purely
 * to satisfy Icinga's notification model. It is always on duty and filters
 * nothing - do the filtering in your apply rules or in incident.io.
 *
 * No `period` is set here or on the template below. An unset period means "no
 * time restriction", which is exactly what we want, and it keeps the
 * integration from depending on the "24x7" TimePeriod. That TimePeriod ships in
 * the stock conf.d/timeperiods.conf, so referencing it would make the whole
 * Icinga config fail validation on any site that manages config through
 * Director or has otherwise stripped conf.d - not just break this integration.
 * ------------------------------------------------------------------------ */
object User "incident-io" {
  display_name = "incident.io"
  enable_notifications = true
}

template Notification "incident-io-notification" {
  command = "incident-io"
  users = [ "incident-io" ]

  /* Re-notify hourly while a problem is open. incident.io dedupes on
   * deduplication_key, so these update the existing alert rather than creating
   * new ones, and recovering the alert state if a POST was lost. */
  interval = 1h

  types = [ Problem, Recovery, Acknowledgement, Custom,
            FlappingStart, FlappingEnd,
            DowntimeStart, DowntimeEnd, DowntimeRemoved ]
}
