/*
 * incident.io integration for Icinga 2 - apply rules.
 *
 * Opt in per object:   vars.incident_io = true
 * Opt out an exception: vars.incident_io = false
 *
 * To route your whole estate instead, replace the assign lines with
 * `assign where true`.
 */

apply Notification "incident-io" to Service {
  import "incident-io-notification"

  vars.incident_io_service       = "$service.name$"
  vars.incident_io_state         = "$service.state$"
  vars.incident_io_output        = "$service.output$"
  vars.incident_io_check_source  = "$service.check_source$"
  vars.incident_io_metadata_json = {{ return incident_io_metadata(host, service) }}

  states = [ Warning, Critical, Unknown, OK ]

  assign where host.vars.incident_io || service.vars.incident_io
  ignore where service.vars.incident_io == false
}

/*
 * Host notifications. incident_io_service is deliberately left unset, which
 * makes the handler build a host-shaped title and dedup key.
 */
apply Notification "incident-io-host" to Host {
  import "incident-io-notification"

  vars.incident_io_state         = "$host.state$"
  vars.incident_io_output        = "$host.output$"
  vars.incident_io_check_source  = "$host.check_source$"
  vars.incident_io_metadata_json = {{ return incident_io_metadata(host, null) }}

  states = [ Up, Down ]

  assign where host.vars.incident_io
  ignore where host.vars.incident_io == false
}
