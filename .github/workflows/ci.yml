name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shells
        run: sudo apt-get update && sudo apt-get install -y dash ksh shellcheck

      - name: Executable bits are recorded in git
        run: |
          missing=0
          for f in bin/incident-io-icinga test/run-tests.sh test/shims/sed \
                   build-linux/make_package.sh \
                   build-linux/postinst contrib/director-basket/generate-basket.sh; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            [ "$mode" = "100755" ] || { echo "$f is $mode, expected 100755"; missing=1; }
          done
          exit $missing

      - name: Shellcheck
        run: make lint

      - name: Test across shells
        run: SHELLS="sh dash bash ksh" ./test/run-tests.sh

      - name: Test with sed in POSIX mode
        run: make test-posix

      - name: Test against mawk and busybox awk
        run: |
          for a in mawk "busybox awk"; do
            d=$(mktemp -d); printf '#!/bin/sh\nexec %s "$@"\n' "$a" > "$d/awk"
            chmod +x "$d/awk"
            PATH="$d:$PATH" SHELLS="sh" ./test/run-tests.sh
          done

  # GNU userland would not have caught the sed N-at-EOF portability bug.
  test-bsd-userland:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test against BSD sed, awk and tr
        run: SHELLS="sh bash" ./test/run-tests.sh

  # Builds on every push and PR. On a v* tag it publishes a GitHub release; on a
  # push to main it refreshes the rolling "edge" prerelease. Because this job
  # needs both test jobs, neither happens unless the tests passed.
  package:
    runs-on: ubuntu-latest
    needs: [test, test-bsd-userland]
    permissions:
      contents: write
    # Two merges to main in quick succession would otherwise race to replace the
    # edge release. Queue instead of cancelling, so the last push still wins.
    concurrency:
      group: package-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Package filenames embed VERSION, so a tag that disagrees with it would
      # publish v0.2.0 assets named 0.1.0. Fail before building, not after.
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          file=$(cat VERSION)
          if [ "$tag" != "$file" ]; then
            echo "tag v$tag does not match VERSION ($file)" >&2
            exit 1
          fi

      # Tip of main is a pre-release of the version being worked toward, so it is
      # stamped VERSION~git<date>.<sha>. "~" sorts before the plain version in
      # both dpkg and rpm, so an edge install upgrades cleanly once that version
      # is tagged. Tags and PRs build the VERSION file as-is.
      - name: Choose package version
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            v="$(cat VERSION)~git$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          else
            v=$(cat VERSION)
          fi
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"
          echo "building $v"

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build deb
        run: make deb

      - name: Build rpm
        run: sudo apt-get update && sudo apt-get install -y rpm && make rpm

      # Building a package only proves fpm ran. Install each one and check the
      # files land where the config expects and the handler executes, so a bad
      # --config-files path or a missing dependency fails here rather than on
      # someone's master.
      - name: Install the built packages
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" debian:12 sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /d/*.deb
            /usr/bin/incident-io-icinga --version
            test -f /etc/icinga2/conf.d/incident-io-command.conf
            test -f /etc/icinga2/conf.d/incident-io-notifications.conf'
          docker run --rm -v "$PWD/dist:/d:ro" rockylinux:9 sh -c '
            set -e
            dnf install -y -q /d/*.rpm
            /usr/bin/incident-io-icinga --version
            test -f /etc/icinga2/conf.d/incident-io-command.conf
            test -f /etc/icinga2/conf.d/incident-io-notifications.conf'

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      # gh is preinstalled on the runner, so this needs no third-party action.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          notes=$(mktemp)

          # Lift this version's section out of the changelog, stopping at the
          # next "## " heading.
          awk -v ver="${tag#v}" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## /            { exit }
            inside                      { print }
          ' CHANGELOG.md > "$notes"

          if [ -s "$notes" ]; then
            gh release create "$tag" dist/* --title "$tag" --notes-file "$notes"
          else
            echo "no CHANGELOG section for $tag, generating notes from commits" >&2
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      # A single release named "edge" whose tag is moved to whatever main points
      # at. Marked prerelease so GitHub never shows it as "Latest", and so the
      # newest real tag keeps that badge.
      - name: Refresh the edge release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Rolling build of the tip of \`main\`, replaced on every merge. Not a
          stable release.

          Packages here are versioned \`$PKG_VERSION\`, which sorts before
          \`$(cat VERSION)\` for both dpkg and rpm, so installing from edge still
          upgrades cleanly once that version is tagged.

          Built from $GITHUB_SHA.
          EOF
          sed -i 's/^          //' "$notes"

          gh release delete edge --yes --cleanup-tag || true
          gh release create edge dist/* \
            --target "$GITHUB_SHA" \
            --title "edge (tip of main)" \
            --prerelease \
            --notes-file "$notes"
